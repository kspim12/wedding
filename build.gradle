plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'com.ryul.wedding.WeddingApplication'
}

// Keep the original wedding photographs local; ship only the web-sized copies.
sourceSets.main.resources.exclude 'img/**'

group = 'com.ryul'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
